<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="contador.css">
    <title>Vamos Contar</title>
</head>
<body onload="carregar()">
    <header>
        <h1>Vamos Contar </h1>

    </header>
    <section class="container">
        <form id="form_contagem" class="form_contagem">
            <div class="form_group">
                <label for="txtinicio">Início</label>
                <input type="number" name="txtinicio" id="txtinicio">
            </div>
            <div class="form_group">
                <label for="txtfim">Fim</label>
                <input type="number" name="txtfim" id="txtfim">
            </div>
             <div class="form_group">
                <label for="txtpasso">Passo</label>
                <input type="number" name="txtpasso" id="txtpasso">
            </div>
            <button type="submit" onclick="contar()" >Contar</button>
        </form>
        <div class="result-area" aria-live="polite">
            <p id="res">Preparando a contagem...</p> 
            <p id="resp"> </p>
        </div>

    </section>
    <footer>
        <p>&copy; Curso em Vídeo</p>
    </footer>
    
    <script src="contador.js"></script>
</body>
</html>
